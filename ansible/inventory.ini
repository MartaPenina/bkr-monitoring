# BKR Monitoring — Ansible Inventory
# Fill in actual IPs from `terraform output` after provisioning.

[jump]
jump-host ansible_host=<JUMP_HOST_IP> ansible_port=9922

[services]
vm-services ansible_host=<VM_SERVICES_IP> ansible_port=9922

[history]
vm-history ansible_host=<VM_HISTORY_IP> ansible_port=9922

[data]
vm-data ansible_host=<VM_DATA_IP> ansible_port=9922

[internal:children]
services
history
data

[all:vars]
ansible_user=ops
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ProxyJump=ops@<JUMP_HOST_IP>:9922'
