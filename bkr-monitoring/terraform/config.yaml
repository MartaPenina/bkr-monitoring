# BKR Monitoring — Infrastructure Configuration
# Switch cloud provider by changing the 'cloud' field.

cloud: gcp

general:
  region: europe-central2
  zone: europe-central2-a
  machine_type: e2-small
  image: ubuntu-os-cloud/ubuntu-2404-lts
  disk_size: 20
  ssh_port: "9922"
  ops_user: ops

  # AWS equivalents (used when cloud: aws)
  aws_region: eu-central-1
  aws_ami: ami-0faab6bdbac9486fb  # Ubuntu 24.04 eu-central-1
  aws_instance_type: t3.small

# Machine size dictionary for multi-cloud
sizes:
  small:
    gcp: e2-small
    aws: t3.small
  micro:
    gcp: e2-micro
    aws: t3.micro
  medium:
    gcp: e2-medium
    aws: t3.medium

vms:
  jump-host:
    tags: ["jump-host"]
    public_ip: true
    machine_type: e2-micro

  vm-services:
    tags: ["internal"]
    public_ip: false
    machine_type: e2-small
    description: "Web UI + API Proxy + Monitoring Collector"

  vm-history:
    tags: ["internal"]
    public_ip: false
    machine_type: e2-small
    description: "History Consumer + History API + Diagnostic Engine"

  vm-data:
    tags: ["internal"]
    public_ip: false
    machine_type: e2-medium
    disk_size: 30
    description: "RabbitMQ + PostgreSQL/TimescaleDB + Dashboard"
