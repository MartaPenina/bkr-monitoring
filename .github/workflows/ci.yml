name: CI/CD

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/martapenina

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: proxy
            context: ./services/proxy
          - service: history-consumer
            context: ./services/history-consumer
          - service: history-api
            context: ./services/history-api
          - service: monitoring-collector
            context: ./services/monitoring-collector
          - service: diagnostic-engine
            context: ./services/diagnostic-engine
          - service: dashboard
            context: ./services/dashboard
          - service: ui
            context: ./services/ui
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/martapenina/bkr-${{ matrix.service }}:latest
            ghcr.io/martapenina/bkr-${{ matrix.service }}:${{ github.sha }}