<div class="panel" id="panel-llm">
  <div class="section">

    <div class="section-header">
      <div class="section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
        Claude AI Diagnostics
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="status-dot" id="llmDot2" style="width:6px;height:6px;border-radius:50%;background:var(--muted)"></div>
        <span id="llmStatusText2" style="font-size:11px;color:var(--muted)">Checking…</span>
      </div>
    </div>

    <!-- LLM summary cards -->
    <div id="llmSummaryCards" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px"></div>

    <!-- Confidence distribution -->
    <div class="section-header">
      <div class="section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Diagnosis confidence distribution
      </div>
    </div>
    <div id="llmConfidence" style="margin-bottom:20px"></div>

    <!-- All LLM diagnoses -->
    <div class="section-header">
      <div class="section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        All Claude AI analyses
      </div>
    </div>
    <div class="incident-list" id="llmDiagList"></div>

  </div>
</div>
