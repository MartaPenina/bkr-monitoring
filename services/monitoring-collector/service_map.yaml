  # ── CoinOps application (AWS eu-central-1) ───────────────────
  # Cross-cloud monitoring: FaultLens on GCP monitors CoinOps on AWS
  # Ports opened in AWS Security Group for GCP IP: 34.118.111.49
 
  coinops-ui:
    url: "https://coinops-penina.pp.ua"
    health_endpoint: "/health"
    port: 443
    depends_on:
      - coinops-proxy
    description: "CoinOps frontend — crypto market dashboard (React SPA via nginx, AWS node-03)"
 
  coinops-proxy:
    url: "http://18.198.197.77:8080"
    health_endpoint: "/health"
    port: 8080
    depends_on:
      - coinops-rabbitmq
    description: "CoinOps proxy — market data fetcher and queue publisher (AWS node-02)"
 
  coinops-history-api:
    url: "http://18.198.197.77:8000"
    health_endpoint: "/health"
    port: 8000
    depends_on:
      - coinops-rabbitmq
    description: "CoinOps history API — historical market data REST API (AWS node-01)"
 
  coinops-history-consumer:
    url: "http://18.198.197.77:5672"
    health_endpoint: null
    port: 5672
    health_check_method: "tcp"
    depends_on:
      - coinops-rabbitmq
    description: "CoinOps history consumer — queue consumer persisting to RDS (AWS node-01)"
 
  coinops-rabbitmq:
    url: "http://18.198.197.77:5672"
    health_endpoint: null
    port: 5672
    health_check_method: "tcp"
    depends_on: []
    description: "CoinOps RabbitMQ — message broker for async pipeline (AWS node-01)"
    metrics:
      - queue_depth
      - consumers_count
      - publish_rate
 
# Fault propagation chains (precomputed for LLM context)
fault_chains:
  # database_down:
  #   root: database
  #   affected:
  #     - history-consumer
  #     - history-api
  #     - web-ui
  #   description: "DB failure breaks all data persistence and retrieval"
 
  # rabbitmq_down:
  #   root: rabbitmq
  #   affected:
  #     - api-proxy
  #     - history-consumer
  #     - web-ui
  #   description: "Queue failure breaks async data pipeline"
 
  # proxy_down:
  #   root: api-proxy
  #   affected:
  #     - web-ui
  #   description: "Proxy failure means no live data for frontend"
 
  coinops_rabbitmq_down:
    root: coinops-rabbitmq
    affected:
      - coinops-proxy
      - coinops-history-consumer
      - coinops-history-api
      - coinops-ui
    description: "CoinOps queue failure breaks entire async data pipeline on AWS"
 
  coinops_proxy_down:
    root: coinops-proxy
    affected:
      - coinops-ui
    description: "CoinOps proxy failure breaks frontend data display"